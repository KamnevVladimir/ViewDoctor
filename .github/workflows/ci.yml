name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: swift test
      - name: Build release
        run: swift build -c release
      - name: Smoke test CLI contract
        run: |
          .build/release/viewdoctor --help | grep -q -- "--staged"
          .build/release/viewdoctor --version | grep -q "ViewDoctor 0.1.7"
          test "$(jq -r '.description | length' registry/server.template.json)" -le 100
      - name: Self scan
        run: .build/release/viewdoctor scan . --format agent > /tmp/viewdoctor-agent.json
      - name: Test MCP adapter
        run: |
          npm ci --prefix plugin/mcp
          npm test --prefix plugin/mcp
